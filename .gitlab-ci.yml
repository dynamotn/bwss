# CI for GitLab: lint, unit tests, audit, end-to-end tests against
# Vaultwarden, static musl binaries, and releases on v* tags.
#
# aarch64 builds need an arm64 runner; set ARM64_RUNNER_TAG for self-managed
# runners (the default is GitLab.com's hosted arm64 runner).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

stages: [check, test, build, release]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  ARM64_RUNNER_TAG: saas-linux-small-arm64
  VAULTWARDEN_IMAGE: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
  PACKAGE_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bwss/${CI_COMMIT_TAG}

default:
  image: rust:1-trixie
  interruptible: true

# Caches speed up checks only. Jobs that produce release artifacts never use
# one, and GitLab keeps protected refs (release tags) on separate caches from
# merge requests by default.
.cargo-cache:
  cache:
    key:
      prefix: $CI_JOB_NAME
      files: [Cargo.lock]
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - target/

lint:
  stage: check
  extends: .cargo-cache
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --locked --all-targets

audit:
  stage: check
  extends: .cargo-cache
  script:
    - cargo install --locked cargo-audit
    - cargo audit

test:
  stage: test
  extends: .cargo-cache
  script:
    - cargo test --locked
    - cargo test --locked --release perf -- --ignored --nocapture

e2e:
  stage: test
  extends: .cargo-cache
  services:
    - name: $VAULTWARDEN_IMAGE
      alias: vaultwarden
      variables:
        SIGNUPS_ALLOWED: "true"
        SIGNUPS_VERIFY: "false"
        DISABLE_ICON_DOWNLOAD: "true"
        I_REALLY_WANT_VOLATILE_STORAGE: "true"
        LOGIN_RATELIMIT_MAX_BURST: "1000"
        LOGIN_RATELIMIT_SECONDS: "1"
  variables:
    # bwss allows plain http only for loopback; socat forwards it to the service.
    BW_E2E_URL: http://127.0.0.1:8080
  before_script:
    - apt-get update
    - >-
      apt-get install -y --no-install-recommends dbus dbus-daemon libsecret-tools socat curl
      python3-pytest python3-secretstorage python3-cryptography python3-jeepney
  script:
    - socat TCP-LISTEN:8080,bind=127.0.0.1,fork,reuseaddr TCP:vaultwarden:80 &
    - cargo build --locked --release
    - for _ in $(seq 60); do curl -fsS "$BW_E2E_URL/alive" && break; sleep 2; done
    # bwss runs a pinentry only from a system directory the user cannot
    # write, and trusts none as root: install the fake one, run as a user.
    - install -o root -g root -m 755 tests/e2e/fake_pinentry.py /usr/local/bin/fake-pinentry
    - useradd --create-home tester
    - >-
      setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester
      dbus-run-session -- python3 -m pytest -q -rf -p no:cacheprovider tests/e2e
  timeout: 20 minutes

# Fully static musl binaries, built without any cache.
.static-binary:
  stage: build
  image: rust:1-alpine
  needs: [lint, test]
  script:
    - apk add --no-cache musl-dev file curl
    - cargo build --locked --release
    - file target/release/bwss
    - strip target/release/bwss
    - mkdir -p dist
    - tar -C target/release -czf "dist/bwss-$ARCH-linux-musl.tar.gz" bwss
    - (cd dist && sha256sum "bwss-$ARCH-linux-musl.tar.gz" > "bwss-$ARCH-linux-musl.tar.gz.sha256")
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        for f in dist/*; do
          curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$PACKAGE_URL/$(basename "$f")"
        done
      fi
  artifacts:
    paths: [dist/]
    expire_in: 30 days

static:x86_64:
  extends: .static-binary
  variables:
    ARCH: x86_64

static:aarch64:
  extends: .static-binary
  variables:
    ARCH: aarch64
  tags: [$ARM64_RUNNER_TAG]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.124.0@sha256:f6837b5aea075ca297281b554556d2fc4f8fb291ace6b48286790790dce622cd
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  needs: [static:x86_64, static:aarch64, e2e, audit]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: bwss $CI_COMMIT_TAG
    description: Static Linux binaries (musl) for x86_64 and aarch64, with SHA-256 checksums.
    assets:
      links:
        - name: bwss-x86_64-linux-musl.tar.gz
          url: $PACKAGE_URL/bwss-x86_64-linux-musl.tar.gz
          link_type: package
        - name: bwss-x86_64-linux-musl.tar.gz.sha256
          url: $PACKAGE_URL/bwss-x86_64-linux-musl.tar.gz.sha256
          link_type: other
        - name: bwss-aarch64-linux-musl.tar.gz
          url: $PACKAGE_URL/bwss-aarch64-linux-musl.tar.gz
          link_type: package
        - name: bwss-aarch64-linux-musl.tar.gz.sha256
          url: $PACKAGE_URL/bwss-aarch64-linux-musl.tar.gz.sha256
          link_type: other
