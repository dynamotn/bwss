# ~/.config/bwss/config.toml
backend = "bitwarden"
server_url = "https://vault.bitwarden.com"
email = "you@example.com"
# Root folder in the vault; collections are its sub-folders ("secret-service/Work").
folder = "secret-service"
# Also show every other item of the vault (logins and secure notes, any folder)
# in a read-only "vault" collection, searchable by bwss:name, bwss:username, bwss:uri
# and bwss:folder.
whole_vault = false
# Any pinentry: pinentry-gnome3, pinentry-qt, pinentry-gtk-2 ...
prompter = "pinentry"
# "prompt": ask before an app reads an item it did not create. "off": gnome-keyring behaviour.
acl = "prompt"
idle_lock_minutes = 0
sync_interval_seconds = 300
