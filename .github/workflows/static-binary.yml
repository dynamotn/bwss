# Builds a fully static musl binary. Shared by CI and releases, and kept free
# of caches so a release can never pick up a poisoned build cache.
name: static binary

on:
  workflow_call:
    inputs:
      arch:
        description: x86_64 or aarch64
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: static binary (${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Alpine builds against musl natively; the result is a fully static binary.
      # It runs as a plain `docker run`, not a job container: GitHub runs no
      # JavaScript action (checkout, upload) inside an Alpine container on arm64.
      - name: Build and package
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          docker run --rm -e ARCH -v "$PWD":/src -w /src rust:1-alpine sh -euc '
            apk add --no-cache musl-dev file
            cargo build --locked --release
            file target/release/bwss
            strip target/release/bwss
            mkdir -p dist
            tar -C target/release -czf "dist/bwss-$ARCH-linux-musl.tar.gz" bwss
            cd dist && sha256sum ./*.tar.gz > "bwss-$ARCH-linux-musl.tar.gz.sha256"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bwss-${{ inputs.arch }}
          path: dist/
