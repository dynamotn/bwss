[package]
name = "bwss"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "freedesktop Secret Service (org.freedesktop.secrets) backed by a Bitwarden vault"
readme = "README.md"
keywords = ["keyring", "secret-service", "bitwarden", "dbus", "libsecret"]
categories = ["command-line-utilities", "cryptography"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

[profile.release]
overflow-checks = true
lto = "thin"
strip = true

[features]
# The dybw conformance vectors (src/vectors.rs): cargo test --features vectors vectors::
vectors = []

[dependencies]
aes = { version = "0.9.3", features = ["zeroize"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
cbc = { version = "0.2.1", features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
dybw-core = { git = "https://gitlab.com/dynamo-tools/dybw-core.git", rev = "96e39d3" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
hex = "0.4.3"
hkdf = "0.13.0"
num-bigint = "0.5.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "process", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }
zbus = { version = "6.0.0", default-features = false, features = ["proxy", "service", "tokio"] }
zeroize = { version = "1.9.1", features = ["derive", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "net"] }
# Tests play the bus driver over a socket pair (acl.rs).
zbus = { version = "6.0.0", default-features = false, features = ["p2p"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process"] }
